name: Deploy

# Production is the Worker "urbanmorph", serving www.urbanmorph.com.
# Only this branch deploys. The `master` branch is the retired Jekyll site
# and must never be deployed here.
on:
  push:
    branches: [astro]
  pull_request:
  workflow_dispatch:
    inputs:
      reason:
        description: Why this manual deploy
        required: false
        default: Manual deploy

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Check the build produced the expected pages
        run: |
          for f in dist/index.html dist/synthesys/index.html dist/sitemap.xml dist/404.html; do
            test -s "$f" || { echo "missing or empty: $f"; exit 1; }
          done
          echo "pages built: $(find dist -name '*.html' | wc -l)"

  deploy:
    name: Deploy to Cloudflare
    needs: build
    # Never deploy from a pull request; only the production branch or a manual run.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://www.urbanmorph.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Deploy worker and assets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
      - name: Smoke test the live site
        run: |
          sleep 10
          for url in https://www.urbanmorph.com/ https://www.urbanmorph.com/synthesys/ https://www.urbanmorph.com/sitemap.xml; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --retry 3 --retry-delay 5 "$url")
            echo "$code  $url"
            [ "$code" = "200" ] || exit 1
          done
